# ==============================================================================
# RESTOPRO — Dedicated Nginx Virtual Host Configuration
# Target Host: Hostinger KVM 2 VPS (/opt/whatsapp_only)
# Upstream Application: Node.js (PM2 process: restopro-backend) on 127.0.0.1:3101
#
# STRICT ISOLATION NOTICE:
# This configuration is dedicated exclusively to RestPro. It does NOT interfere
# with RestroConnect or any other virtual hosts on this server.
#
# REQUIRED USER INPUT:
# Replace 'api.restopro.YOUR_DOMAIN.COM' with your actual registered domain/subdomain.
# ==============================================================================

# Rate limiting zones (defined in http block or included here)
limit_req_zone $binary_remote_addr zone=restopro_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=restopro_webhook_limit:10m rate=50r/s;

upstream restopro_backend {
    server 127.0.0.1:3101 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server — Certbot Validation & Automatic HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.restopro.YOUR_DOMAIN.COM;

    # Let's Encrypt / Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment after obtaining SSL certificate)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Secure Reverse Proxy to RestPro Backend (Port 3101)
# (Activate this block after running certbot to obtain SSL certificates)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.restopro.YOUR_DOMAIN.COM;

    # SSL Certificate Paths (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.restopro.YOUR_DOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.restopro.YOUR_DOMAIN.COM/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Request Body Size & Buffer Limits
    client_max_body_size 5M;
    client_body_buffer_size 1M;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Common Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Dedicated Logging
    access_log /var/log/nginx/restopro_access.log combined;
    error_log /var/log/nginx/restopro_error.log warn;

    # --------------------------------------------------------------------------
    # Meta WhatsApp Webhook Endpoints (High-Throughput, Bounded Burst)
    # --------------------------------------------------------------------------
    location /api/webhook {
        limit_req zone=restopro_webhook_limit burst=30 nodelay;
        proxy_pass http://restopro_backend;
    }

    location /api/central/webhook {
        limit_req zone=restopro_webhook_limit burst=30 nodelay;
        proxy_pass http://restopro_backend;
    }

    # --------------------------------------------------------------------------
    # Health & Readiness Endpoints (Bypass Rate Limiting for Monitoring)
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://restopro_backend;
        access_log off;
    }

    location /ready {
        proxy_pass http://restopro_backend;
        access_log off;
    }

    location /health/ready {
        proxy_pass http://restopro_backend;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Super Admin Dashboard & Static Assets
    # --------------------------------------------------------------------------
    location /admin {
        limit_req zone=restopro_api_limit burst=20 nodelay;
        proxy_pass http://restopro_backend;
    }

    # --------------------------------------------------------------------------
    # General API Routes
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=restopro_api_limit burst=20 nodelay;
        proxy_pass http://restopro_backend;
    }
}

